<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind CSS | One More Little Piggy</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="m-0 p-0 bg-white flex justify-center items-center h-screen overflow-hidden">

  <div class="relative w-[330px] h-[330px]">

    <div class="absolute w-[75px] h-[75px] bg-[#F9BECA] border-[8px] border-black rounded-full z-0 top-0 left-[30px]"></div>
    
    <div class="absolute w-[75px] h-[75px] bg-[#F9BECA] border-[8px] border-black rounded-full z-0 top-0 right-[30px]"></div>

    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[300px] h-[300px] bg-[#F9BECA] border-[8px] border-black rounded-full z-10">
      
      <div class="absolute w-[70px] h-[70px] bg-white border-[3px] border-black rounded-full top-[50px] left-[45px] flex justify-center items-center">
        <div class="w-[37px] h-[37px] bg-black rounded-full"></div>
      </div>

      <div class="absolute w-[70px] h-[70px] bg-white border-[3px] border-black rounded-full top-[50px] right-[45px] flex justify-center items-center">
        <div class="w-[37px] h-[37px] bg-black rounded-full"></div>
      </div>

      <div class="absolute w-[150px] h-[73px] bg-[#F46E86] border-[3px] border-black rounded-[35%/25%] bottom-[30px] left-1/2 -translate-x-1/2 flex justify-between px-[25px] items-center">
        <div class="w-[28px] h-[35px] bg-black rounded-full"></div>
        <div class="w-[28px] h-[35px] bg-black rounded-full"></div>
      </div>

    </div>

  </div>

</body>
</html>
